version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-mplads-sentinel-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - LOG_LEVEL=INFO
      - WEB_CONCURRENCY=2
      - PORT=8000
    volumes:
      # Persist SQLite database & runtime uploads between container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
